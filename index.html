<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Letter Word Grid Flasher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            background-color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: relative;
        }
        
        #wordGrid {
            display: grid;
            height: calc(100vh - 30px);
            width: 100vw;
            gap: 5px;
            padding: 10px;
        }
        
        .word-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-transform: uppercase;
            color: #333;
            font-size: clamp(8px, 2vw, 24px);
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            transition: background-color 0.1s ease;
        }
        
        .word-cell:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }
        
        .word-cell.high-value-word {
            background-color: #4CAF50;
            color: white;
            font-weight: bolder;
        }
        
        .word-cell.high-value-word:hover {
            background-color: #45a049;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #333;
        }
        
        #progressContainer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background-color: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
        }
        
        #progressBar {
            flex: 1;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-right: 10px;
        }
        
        #progressFill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 5px;
        }
        
        #progressText {
            font-size: 12px;
            color: #333;
            white-space: nowrap;
            min-width: 120px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="loading">Loading words...</div>
    <div id="wordGrid"></div>
    <div id="progressContainer">
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
        <div id="progressText">0 / 0 words</div>
    </div>
    
    <script type="module" src="/main.js"></script>
</body>
</html>
