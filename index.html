<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Letter Word Grid Flasher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            background-color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: relative;
        }
        
        #wordGrid {
            display: grid;
            height: 100vh;
            width: 100vw;
            gap: 5px;
            padding: 10px;
        }
        
        .word-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-transform: uppercase;
            color: #333;
            font-size: clamp(8px, 2vw, 24px);
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            transition: background-color 0.1s ease;
        }
        
        .word-cell:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="loading">Loading words...</div>
    <div id="wordGrid"></div>
    
    <script type="module" src="/main.js"></script>
</body>
</html>
